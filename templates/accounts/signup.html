{% extends 'base.html' %}
{% block content %}
<div class='row justify-content-center'><div class='col-md-5'><div class='card p-4'>
  <h2 class='h4'>Create your account</h2>
  <form method='post'>{% csrf_token %}{{ form.as_div }}
    <button class='btn btn-primary w-100 mt-3'>Sign up</button></form>
  <p class='mt-3 mb-0'>Already have an account? <a href='{% url "login" %}'>Log in</a></p>
</div></div></div>
{% endblock %}
