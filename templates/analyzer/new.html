{% extends 'base.html' %}
{% block content %}
<div class='card p-4'><h1 class='h4'>New application</h1>
  <p class='text-muted'>Two steps: upload your resume and paste the job post exactly as it is (emojis and formatting are fine). AFM extracts the role, company and recruiter emails - To and CC - automatically.</p>
  <form method='post' enctype='multipart/form-data'>{% csrf_token %}
    {{ form.as_div }}
    <button class='btn btn-primary mt-3'>Analyze match</button></form></div>
{% endblock %}
